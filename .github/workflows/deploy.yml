name: Build and publish verified bot
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".gitignore"
      - ".github/dependabot.yml"
      - ".github/dependabot.yaml"
  workflow_dispatch:
  schedule:
    - cron: '41 4 * * *'
permissions:
  contents: read
  packages: write
concurrency:
  group: filedropbot-publish
  cancel-in-progress: false
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IMAGE: ghcr.io/sanzharal/filedropbot
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          pull: true
          no-cache: true
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
      - name: Verify Python, Telegram imports and both TLS trust stores
        run: |
          docker run --rm --network none --entrypoint python "$IMAGE:${{ github.sha }}" -c 'import telegram, httpx, dotenv; import py_compile; py_compile.compile("bot.py", cfile="/tmp/bot.pyc", doraise=True)'
          docker run --rm --network none --entrypoint python "$IMAGE:${{ github.sha }}" verify_tls.py
      - name: Publish the tested image
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:${{ github.sha }}"
          docker tag "$IMAGE:${{ github.sha }}" "$IMAGE:latest"
          docker push "$IMAGE:latest"
