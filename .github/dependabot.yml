# Weekly version updates are reviewed before merge; security fixes are not delayed.
# Major upgrades stay in separate PRs. Production deployment follows normal review.
version: 2
updates:
- package-ecosystem: docker
  directory: /
  schedule:
    interval: weekly
    day: monday
    time: 05:00
    timezone: Asia/Almaty
  open-pull-requests-limit: 2
  cooldown:
    default-days: 7
  groups:
    minor-and-patch:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
    security:
      applies-to: security-updates
      patterns:
      - '*'
