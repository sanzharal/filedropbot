services:
  bot:
    build: .
    container_name: filedropbot
    restart: unless-stopped
    user: "${FILEDROP_UID:-1000}:${FILEDROP_GID:-1001}"
    logging:
      driver: journald
      options:
        tag: "{{.Name}}"
    env_file:
      - .env
    environment:
      - DATA_DIR=/app/data
      - HOST_DATA_DIR=${FILEDROP_HOST_DATA_DIR:-/home/ubuntu/projects/filedropbot/data}
      - SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt
    volumes:
      - ./data:/app/data
      - /etc/ssl/certs:/etc/ssl/certs:ro
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 100
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
